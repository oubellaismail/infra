- name: Migrate from root to Ansible service user
  hosts: all
  gather_facts: true
  become: true
  become_user: root

  pre_tasks:
    - name: Wait for SSH to be ready
      wait_for_connection:
        connect_timeout: 20
        sleep: 5
        delay: 5
        timeout: 300

  roles:
    # Ensure ansible service user is created/configured
    - role: ansible_user
      tags: ['ansible_user']

  tasks:
    # Ensure sudo group has passwordless sudo
    - name: Configure passwordless sudo for sudo group
      lineinfile:
        path: /etc/sudoers.d/sudo-group
        line: "%sudo ALL=(ALL) NOPASSWD:ALL"
        create: yes
        mode: '0440'
        validate: 'visudo -cf %s'
      tags: ['ansible_user', 'sudo']

    # Ensure ansible user exists in sudo group
    - name: Ensure ansible user is part of sudo group
      user:
        name: "{{ ansible_service_user | default('ansible') }}"
        groups: sudo
        append: yes
      tags: ['ansible_user', 'groups']

    # Ensure ansible user can SSH in with same key as root
    - name: Copy root authorized_keys to ansible user
      copy:
        src: /root/.ssh/authorized_keys
        dest: "/home/{{ ansible_service_user | default('ansible') }}/.ssh/authorized_keys"
        owner: "{{ ansible_service_user | default('ansible') }}"
        group: "{{ ansible_service_user | default('ansible') }}"
        mode: '0600'
      tags: ['ansible_user', 'ssh']

    # Ensure correct permissions on .ssh dir
    - name: Fix .ssh permissions
      file:
        path: "/home/{{ ansible_service_user | default('ansible') }}/.ssh"
        state: directory
        owner: "{{ ansible_service_user | default('ansible') }}"
        group: "{{ ansible_service_user | default('ansible') }}"
        mode: '0700'
      tags: ['ansible_user', 'ssh']

    # Verify ansible user can sudo
    - name: Verify ansible user can connect with sudo
      command: whoami
      become: true
      become_user: "{{ ansible_service_user | default('ansible') }}"
      register: whoami_out
      changed_when: false
      tags: ['ansible_user', 'test']

    - debug:
        msg: "✅ Ansible user sudo check successful, running as {{ whoami_out.stdout }}"
      when: whoami_out.stdout == 'root'

    # --- Marker file to tell inventory to switch to ansible ---
    - name: Mark ansible user as enabled (local)
      delegate_to: localhost
      run_once: true
      copy:
        content: "ansible user ready\n"
        dest: "{{ playbook_dir }}/../.ansible_user_enabled"
      tags: ['ansible_user', 'marker']
