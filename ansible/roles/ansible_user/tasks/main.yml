- name: Ensure ansible service user exists
  user:
    name: "{{ ansible_service_user | default('ansible') }}"
    shell: /bin/bash
    home: "/home/{{ ansible_service_user | default('ansible') }}"
    create_home: yes
    state: present
  tags: ['ansible_user']

- name: Ensure ansible user is in sudo group
  user:
    name: "{{ ansible_service_user | default('ansible') }}"
    groups: sudo
    append: yes
  tags: ['ansible_user', 'groups']

- name: Ensure .ssh directory exists
  file:
    path: "/home/{{ ansible_service_user | default('ansible') }}/.ssh"
    state: directory
    owner: "{{ ansible_service_user | default('ansible') }}"
    group: "{{ ansible_service_user | default('ansible') }}"
    mode: '0700'
  tags: ['ansible_user', 'ssh']

- name: Check if root authorized_keys exists
  stat:
    path: /root/.ssh/authorized_keys
  register: root_auth_keys

- name: Copy root authorized_keys if exists (first bootstrap)
  copy:
    src: /root/.ssh/authorized_keys
    dest: "/home/{{ ansible_service_user | default('ansible') }}/.ssh/authorized_keys"
    owner: "{{ ansible_service_user | default('ansible') }}"
    group: "{{ ansible_service_user | default('ansible') }}"
    mode: '0600'
    remote_src: yes
  when: ansible_user == "root" and root_auth_keys.stat.exists
  tags: ['ansible_user', 'ssh']

- name: Ensure passwordless sudo for ansible user
  copy:
    dest: /etc/sudoers.d/ansible
    content: "{{ ansible_service_user | default('ansible') }} ALL=(ALL) NOPASSWD:ALL"
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
  tags: ['ansible_user', 'sudo']
