- name: Install UFW (Uncomplicated Firewall)
  apt:
    name: ufw
    state: present
  tags: ['firewall', 'packages']

- name: Set UFW default policies
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }
  tags: ['firewall', 'defaults']

# Always allow SSH no matter what (before enabling UFW)
- name: Ensure SSH is allowed
  ufw:
    rule: allow
    port: "{{ security.ssh_port | default(22) }}"
    proto: tcp
    comment: "Allow SSH for Ansible management"
  tags: ['firewall', 'ssh']

# Apply extra rules from variables if defined
- name: Configure UFW rules from variables
  ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port | default(omit) }}"
    proto: "{{ item.proto | default('any') }}"
    comment: "{{ item.comment | default('') }}"
  loop: "{{ firewall_rules | default([]) }}"
  when: firewall_rules is defined and firewall_rules | length > 0
  tags: ['firewall', 'rules']

# Web ports for frontends only
- name: Allow HTTP (frontend only)
  ufw:
    rule: allow
    port: "80"
    proto: tcp
  when: "'frontend' in group_names"
  tags: ['firewall', 'http']

- name: Allow HTTPS (frontend only)
  ufw:
    rule: allow
    port: "443"
    proto: tcp
  when: "'frontend' in group_names"
  tags: ['firewall', 'https']

# Enable UFW after all rules are in place
- name: Enable and start UFW
  ufw:
    state: enabled
    logging: 'on'
  tags: ['firewall', 'enable']
